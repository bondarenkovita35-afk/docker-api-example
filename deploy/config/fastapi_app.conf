; Supervisor-konfiguration för API:t
; Plats på servern: /etc/supervisor/conf.d/fastapi_app.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status fastapi_app
[program:fastapi_app]
directory=/home/fastapi_service/fastapi_app/api
command=/home/fastapi_service/fastapi_app/deploy/start.sh
; kör som tjänsteanvändaren, aldrig som root
user=fastapi_service
; starta när servern startar, starta om om processen kraschar
autostart=true
autorestart=true
; stoppa även uvicorns worker-processer
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/fastapi_app/error.log
stdout_logfile=/var/log/fastapi_app/access.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB
environment=HOME="/home/fastapi_service",PATH="/home/fastapi_service/fastapi_app/api/venv/bin:/usr/bin:/bin"
